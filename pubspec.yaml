name: dd_check_plugin
description: A flutter plugin for idea to listen to network requests
version: 5.1.0
homepage: https://github.com/mdddj/dd_check_plugin
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  network_info_plus: ^7.0.0
  dio: ^5.9.0
  package_info_plus: ^9.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3
  get_it: ^9.0.5
  logger: ^2.6.2
  hive_ce: ^2.15.1
  hive_ce_flutter: ^2.3.3

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0
  freezed: ^3.2.3
  json_serializable: ^6.11.1


